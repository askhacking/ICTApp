<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ICT App</title>
  <meta name="application-name" content="ICT App">
  <meta name="apple-mobile-web-app-title" content="ICT App">
  <meta name="theme-color" content="#132234">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --navy: #293F59;
      --ink: #132234;
      --band: #081F44;
      --blue: #4D9CBA;
      --sky: #9BC9E3;
      --yellow: #F5BA42;
      --orange: #ED8B34;
      --bs-body-font-family: 'Poppins', system-ui, sans-serif;
      --bs-body-color: #293F59;
      --bs-secondary-color: #5f7088
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(157deg, #293F59 6%, #fff 43%, #A4A4A4 85%) fixed;
      min-height: 100vh
    }

    .text-secondary {
      color: #5f7088 !important
    }

    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column
    }

    .hdr {
      background: var(--ink);
      color: #fff;
      border-radius: 0 0 40px 40px;
      padding: 18px 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .hdr h1 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0
    }

    .ib {
      background: none;
      border: 0;
      color: #fff;
      font-size: 1.35rem;
      position: relative;
      padding: 4px 8px;
      line-height: 1
    }

    .ib.dk {
      color: var(--navy)
    }

    .dot {
      position: absolute;
      top: -4px;
      right: 0;
      background: var(--orange);
      color: var(--ink);
      font-size: .62rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 1px 6px
    }

    .prof {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px 12px;
      color: #fff
    }

    .av {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--sky);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      flex: none
    }

    .band {
      background: var(--band);
      height: 70px;
      border-radius: 21px 21px 0 0;
      margin-top: 6px
    }

    .sheet {
      background: linear-gradient(#CED8E3, #89919A);
      border-radius: 21px 21px 0 0;
      margin-top: -34px;
      padding: 18px 16px 40px;
      flex: 1 0 auto;
      position: relative
    }

    .sheet.flat {
      margin-top: 16px
    }

    .card {
      background: linear-gradient(#ECF0F9, #D3D6DD);
      border: 0;
      border-radius: 21px;
      box-shadow: 1px 2px 5px 1.5px rgba(0, 0, 0, .4)
    }

    .form-control,
    .form-select {
      border-radius: 30px;
      border: 1px solid rgba(0, 0, 0, .28);
      padding: .6rem 1rem;
      background-color: #fff
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 .2rem rgba(41, 63, 89, .2)
    }

    .btn {
      border-radius: 16px;
      font-weight: 600
    }

    .btn-success {
      --bs-btn-color: #fff;
      --bs-btn-bg: var(--navy);
      --bs-btn-border-color: var(--navy);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #1b2c40;
      --bs-btn-hover-border-color: #1b2c40;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #1b2c40;
      --bs-btn-active-border-color: #1b2c40;
      --bs-btn-disabled-color: #fff;
      --bs-btn-disabled-bg: var(--navy);
      --bs-btn-disabled-border-color: var(--navy)
    }

    .btn-outline-success {
      --bs-btn-color: var(--navy);
      --bs-btn-border-color: var(--navy);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: var(--navy);
      --bs-btn-hover-border-color: var(--navy);
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: var(--navy);
      --bs-btn-active-border-color: var(--navy)
    }

    .btn-outline-secondary {
      --bs-btn-color: var(--navy);
      --bs-btn-border-color: #9fb0c2;
      --bs-btn-hover-color: var(--navy);
      --bs-btn-hover-bg: #e1e8ef;
      --bs-btn-hover-border-color: #9fb0c2;
      --bs-btn-active-color: var(--navy);
      --bs-btn-active-bg: #e1e8ef
    }

    .btn-warning {
      --bs-btn-color: var(--ink);
      --bs-btn-bg: var(--orange);
      --bs-btn-border-color: var(--orange);
      --bs-btn-hover-color: var(--ink);
      --bs-btn-hover-bg: #F19D52;
      --bs-btn-hover-border-color: #F19D52;
      --bs-btn-active-color: var(--ink);
      --bs-btn-active-bg: #F19D52;
      --bs-btn-active-border-color: #F19D52;
      --bs-btn-disabled-color: var(--ink);
      --bs-btn-disabled-bg: var(--orange);
      --bs-btn-disabled-border-color: var(--orange)
    }

    .bg-success {
      background-color: var(--blue) !important
    }

    .badge.bg-success {
      color: var(--ink)
    }

    .bg-warning {
      background-color: var(--yellow) !important
    }

    .bg-info-subtle {
      background-color: var(--sky) !important
    }

    .bg-success-subtle {
      background-color: #E1EFF7 !important
    }

    .border-success {
      border-color: var(--blue) !important
    }

    .text-bg-dark {
      background-color: var(--ink) !important
    }

    .alert-warning {
      --bs-alert-bg: #FDF1D4;
      --bs-alert-border-color: var(--yellow);
      --bs-alert-color: #5A3D00
    }

    .pill {
      background: var(--navy);
      color: #fff;
      border-radius: 20px;
      padding: 8px 0;
      flex: 1;
      margin: 0 8px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 4px 4px rgba(0, 0, 0, .25)
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px 0;
      text-align: center;
      font-size: .9rem
    }

    .cg b {
      font-weight: 400
    }

    .cg .sun {
      color: #ff0004
    }

    .cg .now {
      background: var(--navy);
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      line-height: 28px;
      margin: auto
    }

    .qm {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      text-align: center
    }

    .qm button {
      background: none;
      border: 0;
      color: var(--navy);
      font-size: .72rem;
      font-weight: 700;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      line-height: 1.25
    }

    .qc {
      display: flex;
      flex: none;
      width: 56px;
      height: 56px;
      margin: 0 auto 6px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem
    }

    .drw {
      position: fixed;
      inset: 0;
      z-index: 60;
      visibility: hidden
    }

    .drw.on {
      visibility: visible
    }

    .drw-bg {
      position: absolute;
      inset: 0;
      background: rgba(19, 34, 52, .55);
      opacity: 0;
      transition: .2s
    }

    .drw.on .drw-bg {
      opacity: 1
    }

    .drw-p {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 270px;
      background: var(--ink);
      color: #fff;
      transform: translateX(100%);
      transition: .2s;
      padding: 22px 12px;
      overflow: auto
    }

    .drw.on .drw-p {
      transform: none
    }

    .drw-p button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: none;
      border: 0;
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 600;
      text-align: left
    }

    .drw-p button.on {
      background: var(--navy)
    }

    .lg {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--navy)
    }

    .lg-top {
      background: var(--navy);
      padding: 36px 24px 80px;
      text-align: center
    }

    .logo-box {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .25)
    }

    .logo {
      width: 88%;
      height: 88%;
      object-fit: contain
    }

    .logo-fb {
      color: var(--navy);
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.1;
      letter-spacing: .08em;
      text-align: center
    }

    .lg-sheet {
      background: #fafafa;
      margin-top: -44px;
      border-radius: 60px 60px 0 0;
      padding: 36px 32px 40px;
      position: relative;
      min-height: calc(100vh - 232px)
    }

    @keyframes rise {
      from {
        transform: translateY(80px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .lg-sheet.rise {
      animation: rise .7s cubic-bezier(.22, 1, .36, 1) both
    }

    @media (prefers-reduced-motion:reduce) {
      .lg-sheet.rise {
        animation: none
      }
    }

    .seg {
      display: flex;
      gap: 6px;
      overflow-x: auto
    }

    .seg button {
      flex: 1 0 auto;
      border: 0;
      background: #fff;
      border-radius: 99px;
      padding: 7px 12px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy)
    }

    .seg button.on {
      background: var(--navy);
      color: #fff
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(19, 34, 52, .55);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .ov .card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow: auto
    }

    #bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: var(--orange);
      z-index: 99;
      display: none
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: inherit;
      --bs-table-border-color: rgba(41, 63, 89, .22);
      --bs-table-accent-bg: transparent;
      background: transparent
    }

    .table thead th {
      font-weight: 700
    }

    .cg .ev {
      position: relative;
      cursor: pointer
    }

    .cg .ev::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      border-radius: 50%;
      background: var(--orange)
    }

    .cg .now.ev::after {
      bottom: -5px
    }

    .cgrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px
    }

    .mcell {
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .15);
      cursor: pointer;
      font-size: .85rem
    }

    .mcell.done {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy)
    }

    .mcell.lock {
      background: #cbd2db;
      color: #6b7a8c
    }

    @media print {

      .hdr,
      .prof,
      .band,
      .drw,
      #bar,
      #toast,
      .btn,
      .no-print,
      .ov {
        display: none !important
      }

      body {
        background: #fff
      }

      .shell {
        max-width: none
      }

      .sheet {
        background: #fff !important;
        border-radius: 0;
        margin: 0 !important;
        padding: 0 !important
      }

      .card {
        break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ddd
      }

      .table-responsive {
        overflow: visible !important
      }

      .text-nowrap {
        white-space: normal !important
      }

      .table {
        font-size: .8rem
      }
    }
  </style>
</head>

<body>
  <div id="bar"></div>
  <div id="app"></div>
  <div id="toast" class="toast align-items-center text-bg-dark border-0 position-fixed start-50 translate-middle-x"
    style="bottom:90px;z-index:99">
    <div class="toast-body" id="tmsg"></div>
  </div>
  <script>
    /* ====== ISI: alamat proxy (Cloudflare Worker). URL & key Supabase TIDAK ada di file ini ====== */
    const API_URL = 'https://tight-sun-0f6d.askhacking.workers.dev';
    /* ================================================================================================ */
    if (typeof supabase === 'undefined') {
      document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#293F59"><b>Gagal memuat komponen aplikasi</b><div class="small">Periksa koneksi internet, lalu muat ulang.</div><button class="btn btn-success" onclick="location.reload()">Muat ulang</button></div>';
      throw new Error('supabase-js tidak termuat');
    }
    const sb = supabase.createClient(API_URL, 'public-anon-key-placeholder'); // key asli hanya ada di Worker
    const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])), rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    let dev = localStorage.getItem('dev'); if (!dev) { dev = crypto.randomUUID(); localStorage.setItem('dev', dev) }
    let S = null, tab = 'home', LR = [], LU = [], LP = null, hd = '', mode = 0;
    const busy = x => $('#bar').style.display = x ? 'block' : 'none';
    function toast(m, e) { const t = $('#toast'); t.className = 'toast show align-items-center border-0 position-fixed start-50 translate-middle-x text-bg-' + (e ? 'danger' : 'dark'); $('#tmsg').textContent = m; clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200) }
    async function rpc(fn, args, msg) {
      busy(1); const { data, error } = await sb.rpc(fn, { p_device: dev, ...(args || {}) }); busy(0);
      if (error) { const m = error.message; if (m === 'AUTH' || m === 'DEVICE') { await sb.auth.signOut(); logoutLocal(m === 'DEVICE' ? 'Perangkat ini tidak lagi terdaftar. Silakan login ulang.' : 'Sesi berakhir. Silakan login ulang.'); return null } toast(m, 1); return null }
      if (msg) toast(msg); return data
    }
    function modal(h, lock) { closeM(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="card card-body">${h}</div>`; if (!lock) o.onclick = e => { if (e.target === o) closeM() }; document.body.appendChild(o) }
    const closeM = () => { const o = $('#ov'); o && o.remove() };
    const lbl = t => `<label class="form-label fw-semibold small mt-2 mb-1">${t}</label>`;

    /* ---- Login & pendaftaran anggota ---- */
    const LOGO = `<div class="logo-box"><img src="assets/logo.png" alt="ICT Club" class="logo" onerror="this.style.display='none';document.getElementById('lgfb').style.display='block'"><div id="lgfb" class="logo-fb" style="display:none">ICT<br>CLUB</div></div>`;
    let riseOnce = true;
    const lgWrap = h => { const r = riseOnce ? ' rise' : ''; riseOnce = false; return `<div class="lg"><div class="lg-top">${LOGO}</div><div class="lg-sheet${r}">${h}</div></div>` };
    function viewLogin(msg) { closeM(); $('#app').innerHTML = lgWrap(`<h5 class="fw-bold mb-3">Masuk ke akun Anda</h5>${msg ? `<div class="alert alert-warning">${esc(msg)}</div>` : ''}${lbl('NIK')}<input id="nik" class="form-control" inputmode="numeric" autocomplete="username" placeholder="NIK">${lbl('Password')}<input id="pw" type="password" class="form-control" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn btn-success w-100 mt-4 py-2" onclick="doLogin()">Masuk</button><p class="text-secondary small text-center mt-3 mb-1">Lupa password? Hubungi pelatih atau pengurus.</p><p class="text-center small mt-4">Belum menjadi anggota? <a href="#" onclick="viewDaftar();return false">Daftar sebagai anggota</a></p><p class="text-secondary small text-center">Satu akun hanya dapat dipakai di satu perangkat.</p>`) }
    async function viewDaftar() {
      busy(1); const { data } = await sb.rpc('public_divisions'); busy(0); const dv = data || [];
      $('#app').innerHTML = lgWrap(`<h5 class="fw-bold mb-1">Pendaftaran anggota</h5><p class="text-secondary small">Pendaftaran disetujui pelatih, lalu akun diaktifkan pengurus. NIK dan password dikirim ke WhatsApp Anda setelah akun aktif.</p>${lbl('Nama lengkap')}<input id="dn" class="form-control" maxlength="100">${lbl('No. WhatsApp')}<input id="dh" class="form-control" inputmode="tel" placeholder="08xxxxxxxxxx">${lbl('Divisi')}<select id="dd" class="form-select"><option value="">Pilih divisi</option>${dv.map(x => `<option value="${x.id}">${esc(x.nama)}</option>`).join('')}</select>${lbl('Catatan (opsional)')}<input id="dc" class="form-control" maxlength="300"><input id="dw" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="btn btn-success w-100 mt-4 py-2" onclick="doDaftar()">Kirim pendaftaran</button><p class="text-center small mt-3"><a href="#" onclick="viewLogin();return false">Kembali ke login</a></p>`)
    }
    async function doDaftar() {
      const dd = $('#dd').value; if (!dd) return toast('Pilih divisi.', 1); busy(1);
      const { error } = await sb.rpc('submit_registration', { p_nama: $('#dn').value, p_hp: $('#dh').value, p_divisi: +dd, p_catatan: $('#dc').value || null, p_website: $('#dw').value || null }); busy(0);
      if (error) return toast(error.message, 1);
      $('#app').innerHTML = lgWrap(`<div class="text-center"><div class="display-4"><i class="bi bi-check-circle" style="color:var(--blue)"></i></div><h5 class="fw-bold">Pendaftaran terkirim</h5><p class="text-secondary small">Menunggu persetujuan pelatih, lalu aktivasi oleh pengurus. Informasi NIK dan password akan dikirim ke WhatsApp Anda.</p><button class="btn btn-success w-100" onclick="viewLogin()">Kembali ke login</button></div>`)
    }
    async function doLogin() {
      busy(1); const { error } = await sb.auth.signInWithPassword({ email: $('#nik').value.trim() + '@kas.local', password: $('#pw').value }); busy(0);
      if (error) return toast(error.status === 0 || error.name === 'AuthRetryableFetchError' || /fetch|network/i.test(error.message) ? 'Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.' : 'NIK atau password salah.', 1);
      const d = await rpc('claim_device'); if (!d) { await sb.auth.signOut(); return } S = d; start()
    }
    function logoutLocal(m) { S = null; viewLogin(m) }
    async function doLogout() { await sb.auth.signOut(); logoutLocal() }
    function start() { shell(); if (S.user.mustChange) modal(`<h5>Ganti password</h5><p class="text-secondary small">Demi keamanan, ganti password sementara Anda.</p>${lbl('Password saat ini')}<input id="fa" type="password" class="form-control">${lbl('Password baru (min. 6)')}<input id="fb" type="password" class="form-control"><button class="btn btn-success w-100 mt-3" onclick="doForce()">Simpan</button>`, true) }
    async function doForce() { const d = await rpc('change_password', { p_old: $('#fa').value, p_new: $('#fb').value }, 'Password diganti'); if (d) { S.user.mustChange = false; closeM() } }

    /* ---- Shell: header, menu samping, kalender, menu cepat ---- */
    const M = { home: ['Beranda', 'house'], hadir: ['Hadir & Kas', 'cash-coin'], grp: ['Kelompok', 'people'], lap: ['Laporan Kas', 'graph-up'], rh: ['Laporan Hadir', 'calendar-check'], usr: ['Anggota', 'person-lines-fill'], reg: ['Pendaftaran', 'person-plus'], kas: ['Kas Saya', 'wallet2'], evt: ['Event', 'calendar-event'], krs: ['Kursus', 'mortarboard'], nil: ['Nilai', 'award'], akun: ['Akun', 'person-circle'] };
    const ROLEMENU = { pelatih: ['home', 'evt', 'krs', 'hadir', 'grp', 'lap', 'rh', 'usr', 'reg', 'akun'], pengurus: ['home', 'evt', 'krs', 'nil', 'hadir', 'grp', 'lap', 'rh', 'usr', 'reg', 'kas', 'akun'], peserta: ['home', 'evt', 'krs', 'nil', 'kas', 'akun'] };

 ${card('<h6>Per anggota</h6>' + tb(['Nama', 'Role', 'Divisi', 'Hadir', 'Sesi', '%'], A.map(x => [esc(x.nama), x.role, esc(x.divisi), x.hadir, x.sesi, `<span class="${x.sesi && x.hadir * 2 < x.sesi ? 'text-danger' : ''}">${pc(x.hadir, x.sesi)}</span>`])))}
 <div class="d-flex gap-2"><button class="btn btn-success flex-fill" onclick="csvH()">Unduh CSV</button><button class="btn btn-success flex-fill" onclick="print()">Cetak</button></div>`}
    function csvH() { const q = v => '"' + String(v).replace(/"/g, '""') + '"', R = [['NIK', 'Nama', 'Role', 'Divisi', 'Hadir', 'Sesi', 'Persen'], ...LH.perAnggota.map(x => [x.nik, x.nama, x.role, x.divisi, x.hadir, x.sesi, pc(x.hadir, x.sesi)])], a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + R.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = `laporan-kehadiran_${LH.from}_${LH.to}.csv`; a.click() }

    async function vUsr(m) {

      m.innerHTML = (P ? card(`<h6>Divisi</h6>${LD.map(x => `<div class="d-flex justify-content-between align-items-center border-bottom py-1"><span>${esc(x.nama)} <span class="text-secondary small">(${x.jumlah} anggota)</span></span><span class="text-nowrap"><button class="btn btn-sm btn-outline-secondary" onclick="divForm(${x.id})">Ubah</button> <button class="btn btn-sm btn-outline-danger" onclick="divDel(${x.id})">Hapus</button></span></div>`).join('') || '<div class="text-secondary small">Belum ada divisi.</div>'}<button class="btn btn-sm btn-success mt-2" onclick="divForm()">+ Tambah divisi</button>`) : '')
        + `<button class="btn btn-success w-100 mb-2" onclick="userForm()">+ Tambah anggota</button><input id="uq" class="form-control mb-2" placeholder="Cari nama atau NIK" value="${esc(uq)}" oninput="uq=this.value;drawUsrList()"><div id="ul"></div>`;
      drawUsrList()
    }
    function drawUsrList() {
      const q = uq.trim().toLowerCase(), L = LU.map((x, i) => [x, i]).filter(([x]) => !q || x.nama.toLowerCase().includes(q) || String(x.nik).includes(q));
      $('#ul').innerHTML = (q ? `<div class="text-secondary small mb-2">${L.length} dari ${LU.length} anggota</div>` : '') + (L.map(([x, i]) => `<div class="card card-body mb-2"><div><b>${esc(x.nama)}</b> <span class="badge bg-light text-dark border">${x.role}</span> <span class="badge bg-info-subtle text-dark">${esc(x.divisi || 'Tanpa divisi')}</span></div><div class="text-secondary small">${esc(x.nik)} · ${x.active ? 'Aktif' : 'Nonaktif'} · ${x.device ? 'Perangkat terikat' : 'Belum ada perangkat'}</div><div class="d-flex gap-2 flex-wrap mt-2"><button class="btn btn-sm btn-success" onclick="divPick(${i})">Ubah divisi</button><button class="btn btn-sm btn-outline-success" onclick="userForm(${i})">Ubah data</button><button class="btn btn-sm btn-outline-success" onclick="uAct(${i},'resetDevice')">Reset perangkat</button><button class="btn btn-sm btn-outline-success" onclick="uAct(${i},'resetPassword')">Reset password</button><button class="btn btn-sm btn-outline-success" onclick="uAct(${i},'toggle')">${x.active ? 'Nonaktifkan' : 'Aktifkan'}</button></div></div>`).join('') || '<p class="text-secondary">Tidak ada anggota yang cocok.</p>')
    }
    function divForm(id) { const x = LD.find(y => y.id === id); modal(`<h5>${x ? 'Ubah' : 'Tambah'} divisi</h5>${lbl('Nama divisi')}<input id="dn" class="form-control" value="${esc(x?.nama || '')}"><div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="saveDiv(${x ? x.id : 'null'})">Simpan</button><button class="btn btn-outline-secondary flex-fill" onclick="closeM()">Batal</button></div>`) }
    async function saveDiv(id) { const d = await rpc('save_division', { p_nama: $('#dn').value, p_id: id }, 'Divisi tersimpan'); if (d) { closeM(); vUsr($('#main')) } }
    async function divDel(id) { const x = LD.find(y => y.id === id); if (!confirm('Hapus divisi "' + x.nama + '"? Anggotanya menjadi tanpa divisi.')) return; const d = await rpc('delete_division', { p_id: id }, 'Divisi dihapus'); if (d) vUsr($('#main')) }
    function divPick(i) { const x = LU[i]; modal(`<h5>Ubah divisi</h5><p><b>${esc(x.nama)}</b> <span class="text-secondary small">(${x.role})</span></p>${lbl('Divisi')}<select id="dp" class="form-select">${divOpt(x.divisiId)}</select><div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="saveDivPick('${esc(x.nik)}')">Simpan</button><button class="btn btn-outline-secondary flex-fill" onclick="closeM()">Batal</button></div>`) }
    async function saveDivPick(nik) { const v = $('#dp').value, d = await rpc('set_divisi', { p_nik: nik, p_divisi: v ? +v : null }, 'Divisi diperbarui'); if (d) { closeM(); vUsr($('#main')) } }
    const pwBox = (t, n, pw, nik) => modal(`<h5>${t}</h5><p>${esc(n)}${nik ? `<br>NIK (untuk login): <b class="fs-5">${esc(nik)}</b>` : ''}<br>Password sementara:<br><b class="fs-3">${esc(pw)}</b></p><p class="text-secondary small">Berikan ke pengguna. Wajib diganti saat login.</p><button class="btn btn-success" onclick="closeM()">Tutup</button>`);
    async function uAct(i, a) { const x = LU[i]; if (!confirm('Lanjutkan untuk ' + x.nama + '?')) return; const d = await rpc('member_action', { p_nik: x.nik, p_act: a }, 'Berhasil'); if (d) { if (d.password) pwBox('Password direset', x.nama, d.password); vUsr($('#main')) } }
    function userForm(i) { const x = i == null ? null : LU[i], P = S.user.role === 'pelatih'; modal(`<h5>${x ? 'Ubah data anggota' : 'Tambah anggota'}</h5>${x ? `<div class="text-secondary small">NIK <b>${esc(x.nik)}</b> (tidak dapat diubah)</div>` : `<div class="alert alert-secondary py-2 small mb-0 mt-2">NIK dibuat otomatis: tahun daftar + angkatan + nomor urut.</div>${lbl('Angkatan (2 digit)')}<input id="ua" class="form-control" inputmode="numeric" maxlength="2" placeholder="mis. 20">`}${lbl('Nama')}<input id="uc" class="form-control" value="${esc(x?.nama || '')}">${lbl('Role')}<select id="ur" class="form-select">${(P ? ['peserta', 'pengurus', 'pelatih'] : ['peserta']).map(r => `<option ${x && x.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>${lbl('Divisi')}<select id="ud" class="form-select">${divOpt(x?.divisiId || '')}</select>${x ? '' : `${lbl('Password awal (kosongkan = acak)')}<input id="up" class="form-control">`}<div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="saveU(${x ? `'${esc(x.nik)}'` : 'null'})">Simpan</button><button class="btn btn-outline-secondary flex-fill" onclick="closeM()">Batal</button></div>`) }
    async function saveU(nik) {
      const n = $('#uc').value, dv = $('#ud').value, a = { p_nama: n, p_role: $('#ur').value, p_divisi: dv ? +dv : null }; if (nik) a.p_nik = nik; else { a.p_angkatan = $('#ua').value.trim(); a.p_password = $('#up').value || null }
      const d = await rpc('save_member', a, 'Tersimpan'); if (!d) return; closeM(); if (d.nik) pwBox('Anggota ditambahkan', n, d.password, d.nik); vUsr($('#main'))
    }

    /* ---- Kelompok (memakai daftar yang hadir hari ini) ---- */
    function vGrp(m) { m.innerHTML = cardNP(`<h6>Pembagian kelompok</h6><p class="text-secondary small mb-2">Selalu memakai daftar yang hadir hari ini. Tekan lagi untuk mengacak ulang.</p><div class="form-check"><input class="form-check-input" type="checkbox" id="gp" checked><label class="form-check-label" for="gp">Sertakan pengurus yang hadir</label></div>${lbl('Jenis pembagian')}<select id="gm" class="form-select" onchange="$('#gl').textContent=this.value==='div_ukuran'?'Maks. anggota per kelompok':'Jumlah kelompok'"><option value="div_jumlah">Per divisi — tentukan jumlah kelompok per divisi</option><option value="div_ukuran">Per divisi — tentukan maks. anggota per kelompok</option><option value="games">Games — kelompok seimbang antar divisi</option></select><label id="gl" class="form-label fw-semibold small mt-2 mb-1">Jumlah kelompok</label><input id="gn" type="number" min="1" value="2" class="form-control"><button class="btn btn-success w-100 mt-3" onclick="doGrp()">Acak kelompok</button>`) + '<div class="d-none d-print-block mb-2"><h5 class="mb-0">Pembagian Kelompok</h5>' + S.today + '</div><div id="gr"></div>' }
    const li = a => a.map(x => `<li>${esc(x.nama)}${x.role === 'pengurus' ? ' <span class="badge bg-light text-dark border">pengurus</span>' : ''}${x.divisi ? ` <span class="text-secondary small">· ${esc(x.divisi)}</span>` : ''}</li>`).join('');
    async function doGrp() {
      const t = $('#gm').value, n = +$('#gn').value, p = $('#gp').checked; if (!(n >= 1)) return toast('Isi angka minimal 1.', 1);
      if (t === 'games') {
        const d = await rpc('group_games', { p_jumlah: n, p_pengurus: p }); if (!d) return;
        $('#gr').innerHTML = d.map(g => { const c = {}; g.anggota.forEach(x => c[x.divisi] = (c[x.divisi] || 0) + 1); return card(`<h6>Kelompok ${g.kelompok} <span class="text-secondary small">(${g.anggota.length} orang)</span></h6><div class="text-secondary small mb-1">Komposisi: ${Object.keys(c).map(k => esc(k) + ' ' + c[k]).join(' · ')}</div><ul class="mb-0">${li(g.anggota)}</ul>`) }).join('') + '<button class="btn btn-success w-100" onclick="print()">Cetak</button>'
      }
      else {
        const d = await rpc('group_by_divisi', { p_mode: t === 'div_ukuran' ? 'ukuran' : 'jumlah', p_n: n, p_pengurus: p }); if (!d) return;
        $('#gr').innerHTML = d.map(v => card(`<h6>${esc(v.divisi)}</h6>` + v.kelompok.map(g => `<div class="mb-2"><b class="small">Kelompok ${g.kelompok}</b> <span class="text-secondary small">(${g.anggota.length} orang)</span><ul class="mb-0">${li(g.anggota)}</ul></div>`).join(''))).join('') + '<button class="btn btn-success w-100" onclick="print()">Cetak</button>'
      }
    }

    /* ---- Event ---- */
    let EV = [], et = 'UP', ED = null, ES = new Set(), EC = [];
    const evPast = e => (e.selesai || e.mulai) < S.today;
    const evCls = x => x === 'DISETUJUI' ? 'bg-success' : x === 'DITOLAK' ? 'bg-secondary' : 'bg-warning text-dark';
    const myTxt = m => m === 'TIDAK' ? 'Tidak ikut' : m === 'PANITIA' ? 'Panitia' : m === 'PESERTA' ? 'Peserta' : '';
    const EF = { UP: e => e.status === 'DISETUJUI' && !evPast(e), PAST: e => e.status === 'DISETUJUI' && evPast(e), PEND: e => e.status === 'MENUNGGU', REJ: e => e.status === 'DITOLAK' };
    async function vEvt(m) { const d = await rpc('list_events'); if (!d) return; EV = d; drawEvt() }
    function drawEvt() {
      const stf = S.user.role !== 'peserta', P = S.user.role === 'pelatih', T = [['UP', 'Mendatang'], ['PAST', 'Selesai'], ...(stf ? [['PEND', 'Menunggu'], ['REJ', 'Ditolak']] : [])];
      if (!EF[et] || (!stf && et !== 'UP' && et !== 'PAST')) et = 'UP';
      const L = EV.filter(EF[et]).sort((a, b) => et === 'UP' ? a.mulai.localeCompare(b.mulai) : b.mulai.localeCompare(a.mulai));
      $('#main').innerHTML = (stf ? `<button class="btn btn-success w-100 mb-2" onclick="evForm()"><i class="bi bi-plus-lg"></i> ${P ? 'Buat event' : 'Ajukan event (perlu persetujuan pelatih)'}</button>` : '') +
        `<div class="seg mb-2">${T.map(([k, l]) => `<button class="${k === et ? 'on' : ''}" onclick="et='${k}';drawEvt()">${l} (${EV.filter(EF[k]).length})</button>`).join('')}</div>` +
        (L.map(e => `<div class="card card-body mb-2" role="button" onclick="evOpen(${e.id})"><div class="d-flex justify-content-between gap-2"><b>${esc(e.judul)}</b>${e.status !== 'DISETUJUI' ? `<span class="badge ${evCls(e.status)} align-self-start">${e.status}</span>` : ''}</div><div class="text-secondary small"><i class="bi bi-calendar-event"></i> ${fd(e.mulai, e.selesai)}${e.lokasi ? ` · <i class="bi bi-geo-alt"></i> ${esc(e.lokasi)}` : ''}</div>${e.status !== 'DISETUJUI' ? `<div class="text-secondary small">Diajukan oleh ${esc(e.dibuatNama || '-')}</div>` : ''}${e.alasan ? `<div class="small text-danger">Ditolak: ${esc(e.alasan)}</div>` : ''}<div class="d-flex justify-content-between align-items-center mt-1 small"><span>Panitia <b>${e.panitia}</b> · Peserta <b>${e.peserta}</b></span>${e.my ? `<span class="badge ${e.my === 'TIDAK' ? 'bg-secondary' : 'bg-info-subtle text-dark'}">${myTxt(e.my)}</span>` : ''}</div></div>`).join('') || '<p class="text-secondary">Belum ada event.</p>')
    }
    async function evOpen(id) { const d = await rpc('event_detail', { p_id: id }); if (!d) return; ED = d; drawEd() }
    function drawEd() {
      const { event: e, my, members } = ED, stf = S.user.role !== 'peserta', P = S.user.role === 'pelatih', ok = e.status === 'DISETUJUI', canEdit = P || (e.mine && !ok);
      const ik = members.filter(x => x.status === 'IKUT'), pan = ik.filter(x => x.peran === 'PANITIA'), pes = ik.filter(x => x.peran === 'PESERTA'), tdk = members.filter(x => x.status === 'TIDAK');
      const mc = x => `<div class="d-flex justify-content-between align-items-center py-1 border-bottom"><span>${esc(x.nama)} <span class="text-secondary small">${x.role === 'pengurus' ? 'pengurus · ' : ''}${esc(x.divisi || '')}${x.tugas ? ' · ' + esc(x.tugas) : ''}</span></span>${stf && ok ? `<button class="btn btn-sm btn-outline-secondary" onclick="evRm('${esc(x.nik)}')"><i class="bi bi-x-lg"></i></button>` : ''}</div>`;
      const sec = (t, l) => `<h6 class="mt-3 mb-1">${t} (${l.length})</h6>${l.map(mc).join('') || '<div class="text-secondary small">Belum ada.</div>'}`;
      modal(`<div class="d-flex justify-content-between gap-2"><h5>${esc(e.judul)}</h5><span class="badge ${evCls(e.status)} align-self-start">${e.status}</span></div><div class="text-secondary small"><i class="bi bi-calendar-event"></i> ${fd(e.mulai, e.selesai)}${e.lokasi ? ` · <i class="bi bi-geo-alt"></i> ${esc(e.lokasi)}` : ''}</div>${e.deskripsi ? `<p class="small mt-2 mb-0">${esc(e.deskripsi)}</p>` : ''}${e.status === 'MENUNGGU' ? `<div class="small mt-2">Diajukan oleh ${esc(e.dibuatNama || '-')}, menunggu persetujuan pelatih.</div>` : ''}${e.alasan ? `<div class="small mt-2 text-danger">Ditolak: ${esc(e.alasan)}</div>` : ''}`
        + (ok ? `<div class="mt-3"><div class="small fw-semibold mb-1">Pilihan Anda: ${my ? (my.status === 'TIDAK' ? 'Tidak ikut' : 'Ikut sebagai ' + (my.peran === 'PANITIA' ? 'panitia' : 'peserta')) : 'belum memilih'}</div><div class="d-flex gap-2 flex-wrap"><button class="btn btn-sm btn-success" onclick="evPick('peserta')">Ikut sebagai peserta</button><button class="btn btn-sm btn-success" onclick="evPick('panitia')">Ikut sebagai panitia</button><button class="btn btn-sm btn-outline-secondary" onclick="evPick('tidak')">Tidak ikut</button></div></div>` : '')
        + (P && e.status === 'MENUNGGU' ? `<div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="evReview('setuju')">Setujui</button><button class="btn btn-outline-secondary flex-fill" onclick="evReview('tolak')">Tolak</button></div>` : '')
        + (ok ? sec('Panitia', pan) + sec('Peserta', pes) + (stf ? sec('Tidak ikut', tdk) : '') : '')
        + (stf && ok ? `<button class="btn btn-success w-100 mt-3" onclick="evAdd()"><i class="bi bi-person-plus"></i> Tambah panitia / peserta</button>` : '')
        + `<div class="d-flex gap-2 mt-2">${canEdit ? `<button class="btn btn-outline-secondary flex-fill" onclick="evForm(ED.event)">Ubah</button><button class="btn btn-outline-danger flex-fill" onclick="evDel()">Hapus</button>` : ''}<button class="btn btn-outline-secondary flex-fill" onclick="closeM()">Tutup</button></div>`)
    }
    async function evRefresh() { const id = ED.event.id; await evOpen(id); loadCE(); if (tab === 'evt') { const d = await rpc('list_events'); if (d) { EV = d; drawEvt() } } }
    async function evPick(p) { const d = await rpc('event_choice', { p_id: ED.event.id, p_pilihan: p }, 'Pilihan disimpan'); if (d) evRefresh() }
    async function evReview(a) {
      let r = null; if (a === 'tolak') { r = prompt('Alasan penolakan (opsional):'); if (r === null) return }
      const d = await rpc('review_event', { p_id: ED.event.id, p_aksi: a, p_alasan: r }, a === 'setuju' ? 'Event disetujui' : 'Event ditolak'); if (d) { const x = await rpc('get_state'); if (x) S = x; evRefresh() }
    }
    async function evDel() { if (!confirm('Hapus event ini beserta data panitia/pesertanya?')) return; const d = await rpc('delete_event', { p_id: ED.event.id }, 'Event dihapus'); if (d) { closeM(); loadCE(); if (tab === 'evt') vEvt($('#main')) } }
    async function evRm(nik) { if (!confirm('Keluarkan dari event ini?')) return; const d = await rpc('remove_event_member', { p_id: ED.event.id, p_nik: nik }, 'Dikeluarkan'); if (d) evRefresh() }
    function evForm(e) {
      const P = S.user.role === 'pelatih';
      modal(`<h5>${e ? 'Ubah event' : (P ? 'Buat event' : 'Ajukan event')}</h5>${!e && !P ? '<div class="alert alert-secondary py-2 small mb-0">Event yang diajukan pengurus tampil untuk semua setelah disetujui pelatih.</div>' : ''}${lbl('Nama event')}<input id="ej" class="form-control" maxlength="120" value="${esc(e?.judul || '')}"><div class="row g-2"><div class="col">${lbl('Mulai')}<input id="em" type="date" class="form-control" value="${e?.mulai || S.today}"></div><div class="col">${lbl('Selesai (opsional)')}<input id="es" type="date" class="form-control" value="${e?.selesai || ''}"></div></div>${lbl('Lokasi')}<input id="el" class="form-control" maxlength="150" value="${esc(e?.lokasi || '')}">${lbl('Deskripsi')}<textarea id="ed" class="form-control" rows="3" maxlength="1000" style="border-radius:18px">${esc(e?.deskripsi || '')}</textarea><div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="evSave(${e ? e.id : 'null'})">Simpan</button><button class="btn btn-outline-secondary flex-fill" onclick="${e ? 'drawEd()' : 'closeM()'}">Batal</button></div>`)
    }
    async function evSave(id) {
      const d = await rpc('save_event', { p_judul: $('#ej').value, p_mulai: $('#em').value || null, p_selesai: $('#es').value || null, p_lokasi: $('#el').value, p_deskripsi: $('#ed').value, p_id: id }); if (!d) return;
      toast(d.status === 'MENUNGGU' ? 'Event diajukan, menunggu persetujuan pelatih' : 'Event tersimpan'); closeM(); loadCE(); if (tab === 'evt') vEvt($('#main'))
    }
    async function evAdd() {
      const d = await rpc('event_candidates'); if (!d) return; EC = d; ES = new Set();
      modal(`<h5>Tambah ke event</h5>${lbl('Peran')}<select id="ap" class="form-select"><option value="PESERTA">Peserta</option><option value="PANITIA">Panitia</option></select>${lbl('Tugas / seksi (opsional)')}<input id="at" class="form-control" maxlength="100" placeholder="mis. Dokumentasi">${lbl('Cari anggota')}<input id="aq" class="form-control" placeholder="Nama atau NIK" oninput="evCand()"><div id="ac" class="mt-2" style="max-height:38vh;overflow:auto"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" id="ab" onclick="evAddSave()">Tambahkan</button><button class="btn btn-outline-secondary flex-fill" onclick="drawEd()">Batal</button></div>`); evCand()
    }
    function evCand() {
      const q = ($('#aq').value || '').trim().toLowerCase(), ex = new Set(ED.members.filter(x => x.status === 'IKUT').map(x => x.nik));
      const L = EC.filter(x => !q || x.nama.toLowerCase().includes(q) || String(x.nik).includes(q)).slice(0, 80);
      $('#ac').innerHTML = L.map(x => `<label class="d-flex align-items-center gap-2 py-1 border-bottom"><input type="checkbox" class="form-check-input mt-0" ${ES.has(x.nik) ? 'checked' : ''} onchange="evTog('${esc(x.nik)}',this.checked)"><span class="flex-fill">${esc(x.nama)} <span class="text-secondary small">${x.role === 'pengurus' ? 'pengurus · ' : ''}${esc(x.divisi || '')}</span></span>${ex.has(x.nik) ? '<span class="badge bg-info-subtle text-dark">sudah ikut</span>' : ''}</label>`).join('') || '<div class="text-secondary small">Tidak ada anggota yang cocok.</div>'
    }
    function evTog(n, c) { c ? ES.add(n) : ES.delete(n); $('#ab').textContent = ES.size ? `Tambahkan (${ES.size})` : 'Tambahkan' }
    async function evAddSave() {
      if (!ES.size) return toast('Pilih minimal satu anggota.', 1);
      const d = await rpc('add_event_members', { p_id: ED.event.id, p_niks: [...ES], p_peran: $('#ap').value, p_tugas: $('#at').value || null }); if (!d) return;
      toast(d.jumlah + ' anggota ditambahkan'); ES = new Set(); evRefresh()
    }

    /* ---- E-Learning ---- */
    let KR = null, KD = null, MD = null, SBL = [], SBA = 0;
    const stf_ = () => S.user.role !== 'peserta', pel_ = () => S.user.role === 'pelatih';
    const dtj = t => t ? new Date(t).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const bk = (fn, l) => `<button class="btn btn-sm btn-outline-secondary mb-2" onclick="${fn}"><i class="bi bi-chevron-left"></i> ${l}</button>`;
    const pbar = (a, b) => `<div class="progress mt-2" style="height:6px"><div class="progress-bar" style="width:${b ? Math.round(a * 100 / b) : 0}%;background:var(--navy)"></div></div>`;
    const tarea = (id, v, r, mx) => `<textarea id="${id}" class="form-control" rows="${r}" maxlength="${mx}" style="border-radius:18px">${esc(v || '')}</textarea>`;
    const btns = (ok, fn) => `<div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="${fn}">${ok}</button><button class="btn btn-outline-secondary flex-fill" onclick="closeM()">Batal</button></div>`;
    const apv = (fn, fn2) => `<div class="d-flex gap-2 mt-2"><button class="btn btn-success flex-fill" onclick="${fn}('setuju')">Setujui</button><button class="btn btn-outline-secondary flex-fill" onclick="${fn}('tolak')">Tolak</button></div>`;
    const eds = (a, b) => `<div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-outline-secondary flex-fill" onclick="${a}">Ubah</button><button class="btn btn-sm btn-outline-danger flex-fill" onclick="${b}">Hapus</button></div>`;
    const sent = d => toast(d.status === 'MENUNGGU' ? 'Diajukan, menunggu persetujuan pelatih' : 'Tersimpan');
    async function reviewCall(fn, id, a, ok, no) { let r = null; if (a === 'tolak') { r = prompt('Alasan penolakan (opsional):'); if (r === null) return false } return !!(await rpc(fn, { p_id: id, p_aksi: a, p_alasan: r }, a === 'setuju' ? ok : no)) }

    /* kursus */
    async function vKrs() { const d = await rpc('list_courses'); if (!d) return; KR = d; $('#ttl').textContent = 'Kursus'; drawKrs() }
    function drawKrs() {
      const stf = stf_(), P = pel_(), g = {}, t = KR.todo; KR.courses.forEach(c => (g[c.divisi || 'Umum'] = g[c.divisi || 'Umum'] || []).push(c));
      $('#main').innerHTML = (stf ? `<button class="btn btn-success w-100 mb-2" onclick="krsForm()"><i class="bi bi-plus-lg"></i> ${P ? 'Buat kursus' : 'Ajukan kursus (perlu persetujuan pelatih)'}</button>` : '')
        + (t && (t.approval || t.nilai) ? card(`<div class="fw-semibold small mb-1">Perlu tindakan</div><div class="small">${t.approval} menunggu persetujuan · ${t.nilai} pengumpulan belum dinilai</div>`) : '')
        + (Object.keys(g).sort().map(k => `<div class="fw-semibold mt-3 mb-1 px-1">${esc(k)}</div>` + g[k].map(c => `<div class="card card-body mb-2" role="button" onclick="krsOpen(${c.id})"><div class="d-flex justify-content-between gap-2"><b>${esc(c.judul)}</b>${c.status !== 'DISETUJUI' ? `<span class="badge ${evCls(c.status)} align-self-start">${c.status}</span>` : ''}</div><div class="text-secondary small">${c.jumlah} pertemuan${stf && c.menunggu ? ` · ${c.menunggu} belum terbit` : ''}${c.status !== 'DISETUJUI' ? ' · diajukan oleh ' + esc(c.dibuatNama || '-') : ''}</div>${!P && c.status === 'DISETUJUI' ? pbar(c.selesai, c.jumlah) : ''}</div>`).join('')).join('') || '<p class="text-secondary">Belum ada kursus.</p>')
    }
    async function krsOpen(id) { const d = await rpc('course_detail', { p_id: id }); if (!d) return; KD = d; drawKd() }
    function drawKd() {
      const { course: c, meetings: ms } = KD, P = pel_(), stf = stf_(), ap = ms.filter(m => m.status === 'DISETUJUI'), dn = ap.filter(m => m.done).length;
      $('#ttl').textContent = c.judul;
      $('#main').innerHTML = bk('vKrs()', 'Kursus') + card(`<div class="d-flex justify-content-between gap-2"><h5 class="mb-0">${esc(c.judul)}</h5><span class="badge ${evCls(c.status)} align-self-start">${c.status}</span></div><div class="text-secondary small">${esc(c.divisi || 'Umum')}${c.status !== 'DISETUJUI' ? ' · diajukan oleh ' + esc(c.dibuatNama || '-') : ''}</div>${c.deskripsi ? `<p class="small mt-2 mb-0">${esc(c.deskripsi)}</p>` : ''}${c.alasan ? `<div class="small mt-2 text-danger">Ditolak: ${esc(c.alasan)}</div>` : ''}${P && c.status === 'MENUNGGU' ? apv('krsReview') : ''}${c.canEdit ? eds('krsForm(KD.course)', 'krsDel()') : ''}`)
        + (stf ? `<button class="btn btn-success w-100 mb-2" onclick="mtForm()"><i class="bi bi-plus-lg"></i> ${P ? 'Tambah pertemuan' : 'Ajukan pertemuan'}</button>` : '')
        + card(`<h6>Pertemuan</h6><div class="cgrid">${ms.map(m => `<div class="mcell ${m.status !== 'DISETUJUI' ? 'lock' : m.done ? 'done' : ''}" onclick="mtOpen(${m.id})">${m.nomor}</div>`).join('') || '<div class="text-secondary small">Belum ada pertemuan.</div>'}</div><div class="small text-secondary mt-2">${P ? '' : 'Biru tua = selesai · '}Putih = terbit${stf ? ' · Abu-abu = belum terbit' : ''}</div>`)
        + (!P && ap.length ? card(`<div class="d-flex justify-content-between small"><span>Progres</span><b>${dn} / ${ap.length}</b></div>${pbar(dn, ap.length)}`) : '')
    }
    async function krsReview(a) { if (await reviewCall('review_course', KD.course.id, a, 'Kursus disetujui', 'Kursus ditolak')) krsOpen(KD.course.id) }
    async function krsDel() { if (!confirm('Hapus kursus ini beserta semua pertemuan dan tugasnya?')) return; const d = await rpc('delete_course', { p_id: KD.course.id }, 'Kursus dihapus'); if (d) vKrs() }
    async function krsForm(c) {
      const dv = await rpc('list_divisions'); if (!dv) return; const P = pel_();
      modal(`<h5>${c ? 'Ubah kursus' : (P ? 'Buat kursus' : 'Ajukan kursus')}</h5>${!c && !P ? '<div class="alert alert-secondary py-2 small mb-0">Kursus yang diajukan pengurus tampil untuk peserta setelah disetujui pelatih.</div>' : ''}${lbl('Nama kursus')}<input id="kj" class="form-control" maxlength="120" value="${esc(c?.judul || '')}">${lbl('Divisi')}<select id="kd" class="form-select"><option value="">Umum (semua divisi)</option>${dv.map(x => `<option value="${x.id}" ${c && String(c.divisiId) === String(x.id) ? 'selected' : ''}>${esc(x.nama)}</option>`).join('')}</select>${lbl('Deskripsi')}${tarea('kk', c?.deskripsi, 3, 1000)}${btns('Simpan', `krsSave(${c ? c.id : 'null'})`)}`)
    }
    async function krsSave(id) { const dd = $('#kd').value, d = await rpc('save_course', { p_judul: $('#kj').value, p_deskripsi: $('#kk').value, p_divisi: dd ? +dd : null, p_id: id }); if (!d) return; sent(d); closeM(); id ? krsOpen(id) : vKrs() }

    /* pertemuan, materi, tugas */
    async function mtOpen(id) { const d = await rpc('meeting_detail', { p_id: id }); if (!d) return; MD = d; drawMd() }
    function drawMd() {
      const { meeting: m, items, tugas, done } = MD, P = pel_(), stf = stf_(), ok = m.status === 'DISETUJUI', can = m.canEdit;
      $('#ttl').textContent = 'Pertemuan ' + m.nomor;
      const ic = i => i.jenis === 'TEKS' ? 'file-text' : /youtu/.test(i.url) ? 'youtube' : /google\.com/.test(i.url) ? 'file-earmark' : 'link-45deg';
      const itm = items.map(i => `<div class="card card-body mb-2"><div class="d-flex align-items-center gap-2"><i class="bi bi-${ic(i)} fs-5"></i><b class="flex-fill">${esc(i.judul)}</b>${i.jenis === 'TAUTAN' ? `<a class="btn btn-sm btn-outline-success" href="${esc(i.url)}" target="_blank" rel="noopener">Buka</a>` : ''}</div>${i.jenis === 'TEKS' ? `<div class="small mt-2" style="white-space:pre-wrap">${esc(i.isi)}</div>` : ''}${can ? eds(`itForm(${i.id})`, `itDel(${i.id})`) : ''}</div>`).join('');
      const tg = tugas.map(t => {
        const my = t.my; let body;
        if (stf) body = `<div class="small mt-2">Terkumpul <b>${t.jml}</b> · Dinilai <b>${t.dinilai}</b></div><button class="btn btn-sm btn-success mt-2" onclick="subOpen(${t.id})">Lihat pengumpulan</button>`;
        else if (my && my.nilai != null) body = `<div class="mt-2"><span class="badge bg-success">Nilai ${my.nilai}</span> ${my.terlambat ? '<span class="badge bg-warning text-dark">Terlambat</span>' : ''}${my.feedback ? `<div class="small mt-1">${esc(my.feedback)}</div>` : ''}<a class="small d-block mt-1" href="${esc(my.link)}" target="_blank" rel="noopener">Lihat file terkumpul</a></div>`;
        else body = `${my ? `<div class="small mt-2">Dikumpulkan ${dtj(my.at)} ${my.terlambat ? '<span class="badge bg-warning text-dark">Terlambat</span>' : ''} · <a href="${esc(my.link)}" target="_blank" rel="noopener">lihat file</a></div>` : ''}${lbl('Link file Google Drive')}<input id="tl${t.id}" class="form-control" placeholder="https://drive.google.com/file/d/…/view" value="${esc(my?.link || '')}"><input id="tc${t.id}" class="form-control mt-2" placeholder="Catatan (opsional)" maxlength="300" value="${esc(my?.catatan || '')}"><div class="text-secondary small mt-1">PDF, gambar, atau video: unggah ke Google Drive, atur akses "Siapa saja yang memiliki link", lalu tempel link file (bukan folder).</div><button class="btn btn-warning w-100 mt-2" onclick="subSend(${t.id})">${my ? 'Perbarui pengumpulan' : 'Kumpulkan'}</button>`;
        return `<div class="card card-body mb-2"><div class="d-flex justify-content-between gap-2"><b>${esc(t.judul)}</b>${t.tenggat ? `<span class="small text-secondary text-nowrap">Tenggat ${dtj(t.tenggat)}</span>` : ''}</div>${t.instruksi ? `<div class="small mt-1" style="white-space:pre-wrap">${esc(t.instruksi)}</div>` : ''}${body}${can ? eds(`tgForm(${t.id})`, `tgDel(${t.id})`) : ''}</div>`
      }).join('');
      $('#main').innerHTML = bk(`krsOpen(${m.courseId})`, esc(m.course)) + card(`<div class="d-flex justify-content-between gap-2"><h5 class="mb-0">${esc(m.judul)}</h5><span class="badge ${evCls(m.status)} align-self-start">${m.status}</span></div>${m.deskripsi ? `<p class="small mt-2 mb-0">${esc(m.deskripsi)}</p>` : ''}${!ok ? `<div class="small mt-2">Diajukan oleh ${esc(m.dibuatNama || '-')}</div>` : ''}${m.alasan ? `<div class="small mt-2 text-danger">Ditolak: ${esc(m.alasan)}</div>` : ''}${P && m.status === 'MENUNGGU' ? apv('mtReview') : ''}${can ? eds('mtForm(MD.meeting)', 'mtDel()') : ''}`)
        + `<div class="fw-semibold mt-3 mb-1 px-1">Materi</div>` + (itm || '<p class="text-secondary small px-1">Belum ada materi.</p>') + (can ? `<button class="btn btn-outline-success w-100 mb-2" onclick="itForm()">+ Materi</button>` : '')
        + (ok && !P ? `<button class="btn ${done ? 'btn-outline-success' : 'btn-success'} w-100 mb-2" onclick="mtDone(${!done})">${done ? 'Batalkan tanda selesai' : 'Tandai pertemuan selesai'}</button>` : '')
        + `<div class="fw-semibold mt-3 mb-1 px-1">Tugas</div>` + (tg || '<p class="text-secondary small px-1">Belum ada tugas.</p>') + (can ? `<button class="btn btn-outline-success w-100 mb-2" onclick="tgForm()">+ Tugas</button>` : '')
    }
    async function mtDone(v) { const d = await rpc('mark_meeting_done', { p_id: MD.meeting.id, p_done: v }, v ? 'Ditandai selesai' : 'Tanda selesai dibatalkan'); if (d) mtOpen(MD.meeting.id) }
    async function mtReview(a) { if (await reviewCall('review_meeting', MD.meeting.id, a, 'Pertemuan disetujui', 'Pertemuan ditolak')) mtOpen(MD.meeting.id) }
    async function mtDel() { if (!confirm('Hapus pertemuan ini beserta materi dan tugasnya?')) return; const d = await rpc('delete_meeting', { p_id: MD.meeting.id }, 'Pertemuan dihapus'); if (d) krsOpen(MD.meeting.courseId) }
    function mtForm(m) { const P = pel_(); modal(`<h5>${m ? 'Ubah pertemuan' : (P ? 'Tambah pertemuan' : 'Ajukan pertemuan')}</h5>${lbl('Judul pertemuan')}<input id="mj" class="form-control" maxlength="120" value="${esc(m?.judul || '')}">${lbl('Nomor pertemuan' + (m ? '' : ' (kosongkan = otomatis)'))}<input id="mn" type="number" min="1" class="form-control" value="${m ? m.nomor : ''}">${lbl('Deskripsi')}${tarea('md', m?.deskripsi, 3, 1000)}${btns('Simpan', `mtSave(${m ? m.id : 'null'})`)}`) }
    async function mtSave(id) { const n = $('#mn').value, d = await rpc('save_meeting', { p_course: id ? null : KD.course.id, p_judul: $('#mj').value, p_nomor: n ? +n : null, p_deskripsi: $('#md').value, p_id: id }); if (!d) return; sent(d); closeM(); id ? mtOpen(id) : krsOpen(KD.course.id) }
    function itForm(id) { const i = id ? MD.items.find(x => x.id === id) : null; modal(`<h5>${i ? 'Ubah materi' : 'Tambah materi'}</h5>${lbl('Jenis')}<select id="xj" class="form-select"><option value="TEKS" ${i?.jenis === 'TEKS' ? 'selected' : ''}>Teks</option><option value="TAUTAN" ${i?.jenis === 'TAUTAN' ? 'selected' : ''}>Tautan (YouTube, Drive, dll.)</option></select>${lbl('Judul')}<input id="xt" class="form-control" maxlength="120" value="${esc(i?.judul || '')}">${lbl('Isi teks (untuk jenis Teks)')}${tarea('xk', i?.isi, 4, 5000)}${lbl('Tautan https:// (untuk jenis Tautan)')}<input id="xu" class="form-control" value="${esc(i?.url || '')}">${btns('Simpan', `itSave(${id || 'null'})`)}`) }
    async function itSave(id) { const d = await rpc('save_item', { p_meeting: id ? null : MD.meeting.id, p_jenis: $('#xj').value, p_judul: $('#xt').value, p_isi: $('#xk').value, p_url: $('#xu').value, p_id: id }, 'Materi tersimpan'); if (d) { closeM(); mtOpen(MD.meeting.id) } }
    async function itDel(id) { if (!confirm('Hapus materi ini?')) return; const d = await rpc('delete_item', { p_id: id }, 'Materi dihapus'); if (d) mtOpen(MD.meeting.id) }
    function tgForm(id) { const t = id ? MD.tugas.find(x => x.id === id) : null, tv = t && t.tenggat ? new Date(t.tenggat).toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).slice(0, 16).replace(' ', 'T') : ''; modal(`<h5>${t ? 'Ubah tugas' : 'Tambah tugas'}</h5>${lbl('Judul tugas')}<input id="yj" class="form-control" maxlength="120" value="${esc(t?.judul || '')}">${lbl('Instruksi')}${tarea('yi', t?.instruksi, 3, 2000)}${lbl('Tenggat (opsional, waktu Jakarta)')}<input id="yt" type="datetime-local" class="form-control" value="${tv}">${btns('Simpan', `tgSave(${id || 'null'})`)}`) }
    async function tgSave(id) { const d = await rpc('save_assignment', { p_meeting: id ? null : MD.meeting.id, p_judul: $('#yj').value, p_instruksi: $('#yi').value, p_tenggat: $('#yt').value, p_id: id }, 'Tugas tersimpan'); if (d) { closeM(); mtOpen(MD.meeting.id) } }
    async function tgDel(id) { if (!confirm('Hapus tugas ini beserta semua pengumpulannya?')) return; const d = await rpc('delete_assignment', { p_id: id }, 'Tugas dihapus'); if (d) mtOpen(MD.meeting.id) }

    /* pengumpulan & penilaian */
    async function subSend(id) { const d = await rpc('submit_assignment', { p_id: id, p_link: $('#tl' + id).value, p_catatan: $('#tc' + id).value }, 'Tugas dikumpulkan'); if (d) mtOpen(MD.meeting.id) }
    async function subOpen(aid) {
      const d = await rpc('list_submissions', { p_assignment: aid }); if (!d) return; SBL = d; SBA = aid; const P = pel_();
      modal(`<h5>Pengumpulan tugas</h5><div class="small text-secondary mb-2">${d.filter(x => x.id).length} dari ${d.length} sudah mengumpulkan</div>${d.map((x, i) => `<div class="py-2 border-bottom"><div class="d-flex justify-content-between gap-2"><span>${esc(x.nama)} <span class="text-secondary small">${x.role === 'pengurus' ? 'pengurus · ' : ''}${esc(x.divisi || '')}</span></span>${x.id ? (x.nilai != null ? `<span class="badge bg-success">${x.nilai}</span>` : '<span class="badge bg-warning text-dark">Belum dinilai</span>') : '<span class="badge bg-secondary">Belum</span>'}</div>${x.id ? `<div class="small mt-1">${esc(x.at)} ${x.terlambat ? '<span class="badge bg-warning text-dark">Terlambat</span>' : ''}${x.catatan ? ' · ' + esc(x.catatan) : ''}</div><div class="d-flex gap-2 mt-1"><a class="btn btn-sm btn-outline-success" href="${esc(x.link)}" target="_blank" rel="noopener">Buka file</a>${P ? `<button class="btn btn-sm btn-success" onclick="gradeForm(${i})">${x.nilai != null ? 'Ubah nilai' : 'Nilai'}</button>` : ''}</div>` : ''}</div>`).join('') || '<p class="text-secondary small">Tidak ada anggota di divisi ini.</p>'}<button class="btn btn-outline-secondary w-100 mt-3" onclick="closeM()">Tutup</button>`)
    }
    function gradeForm(i) { const x = SBL[i]; modal(`<h5>Nilai: ${esc(x.nama)}</h5><a class="btn btn-sm btn-outline-success mb-1" href="${esc(x.link)}" target="_blank" rel="noopener">Buka file</a>${lbl('Nilai (0–100)')}<input id="gv" type="number" min="0" max="100" class="form-control" value="${x.nilai ?? ''}">${lbl('Catatan untuk peserta (opsional)')}<input id="gf" class="form-control" maxlength="300" value="${esc(x.feedback || '')}"><div class="d-flex gap-2 mt-3"><button class="btn btn-success flex-fill" onclick="gradeSave(${x.id})">Simpan</button><button class="btn btn-outline-secondary flex-fill" onclick="subOpen(SBA)">Batal</button></div>`) }
    async function gradeSave(id) { const v = $('#gv').value; if (v === '') return toast('Isi nilai 0–100.', 1); const d = await rpc('grade_submission', { p_id: id, p_nilai: +v, p_feedback: $('#gf').value }, 'Nilai tersimpan'); if (d) { subOpen(SBA); mtOpen(MD.meeting.id) } }

    /* nilai saya */
    async function vNil() {
      const d = await rpc('my_grades'); if (!d) return; $('#ttl').textContent = 'Nilai'; const g = {}; d.rows.forEach(r => (g[r.course] = g[r.course] || []).push(r));
      $('#main').innerHTML = `<div class="row g-2 mb-2"><div class="col-6"><div class="card card-body"><div class="text-secondary small">Rata-rata nilai</div><b class="fs-4">${d.rataRata ?? '-'}</b></div></div><div class="col-6"><div class="card card-body"><div class="text-secondary small">Tugas dinilai</div><b class="fs-4">${d.dinilai} / ${d.total}</b></div></div></div>`
        + (Object.keys(g).map(k => `<div class="fw-semibold mt-3 mb-1 px-1">${esc(k)}</div>` + g[k].map(r => `<div class="card card-body mb-2"><div class="d-flex justify-content-between gap-2"><span>Pertemuan ${r.pertemuan} · ${esc(r.tugas)}</span>${r.nilai != null ? `<span class="badge bg-success">${r.nilai}</span>` : r.terkumpul ? '<span class="badge bg-warning text-dark">Menunggu nilai</span>' : '<span class="badge bg-secondary">Belum dikumpulkan</span>'}</div>${r.feedback ? `<div class="small text-secondary">${esc(r.feedback)}</div>` : ''}</div>`).join('')).join('') || '<p class="text-secondary">Belum ada tugas.</p>')
    }

    /* ---- Akun ---- */
    function vAkun(m) { const u = S.user; m.innerHTML = card(`<h6>${esc(u.nama)}</h6><div class="text-secondary small">NIK ${esc(u.nik)} · ${u.role}</div>`) + card(`<h6>Ganti password</h6>${lbl('Password lama')}<input id="pa" type="password" class="form-control">${lbl('Password baru (min. 6)')}<input id="pb" type="password" class="form-control"><button class="btn btn-success w-100 mt-3" onclick="chPw()">Simpan</button>`) + `<button class="btn btn-danger w-100" onclick="doLogout()">Keluar</button>` }
    async function chPw() { const d = await rpc('change_password', { p_old: $('#pa').value, p_new: $('#pb').value }, 'Password diganti'); if (d) { $('#pa').value = ''; $('#pb').value = '' } }

    /* ---- Init ---- */
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);
    async function init() {
      $('#app').innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#293F59"><div class="spinner-border"></div><div class="small">Memuat…</div></div>';
      let session = null;
      try { ({ data: { session } } = await withTimeout(sb.auth.getSession(), 8000)) }
      catch (e) {
        // sesi lama macet (server tidak terjangkau): bersihkan sesi tersimpan lalu muat ulang sekali
        Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
        if (!sessionStorage.getItem('rl')) { sessionStorage.setItem('rl', '1'); return location.reload() }
        return viewLogin('Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang.')
      }
      sessionStorage.removeItem('rl');
      if (!session) return viewLogin();
      const d = await withTimeout(rpc('get_state'), 12000).catch(() => null);
      if (d) { S = d; start() } else if (!$('.lg')) viewLogin('Gagal memuat data. Silakan masuk kembali.')
    }
    init();
  </script>
</body>

</html>
