<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ICT App</title>
  <meta name="application-name" content="ICT App">
  <meta name="apple-mobile-web-app-title" content="ICT App">
  <meta name="theme-color" content="#132234">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --navy: #293F59;
      --ink: #132234;
      --band: #081F44;
      --blue: #4D9CBA;
      --sky: #9BC9E3;
      --yellow: #F5BA42;
      --orange: #ED8B34;
      --bs-body-font-family: 'Poppins', system-ui, sans-serif;
      --bs-body-color: #293F59;
      --bs-secondary-color: #5f7088
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(157deg, #293F59 6%, #fff 43%, #A4A4A4 85%) fixed;
      min-height: 100vh
    }

    .text-secondary {
      color: #5f7088 !important
    }

    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column
    }

    .hdr {
      background: var(--ink);
      color: #fff;
      border-radius: 0 0 40px 40px;
      padding: 18px 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .hdr h1 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0
    }

    .ib {
      background: none;
      border: 0;
      color: #fff;
      font-size: 1.35rem;
      position: relative;
      padding: 4px 8px;
      line-height: 1
    }

    .ib.dk {
      color: var(--navy)
    }

    .dot {
      position: absolute;
      top: -4px;
      right: 0;
      background: var(--orange);
      color: var(--ink);
      font-size: .62rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 1px 6px
    }

    .prof {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px 12px;
      color: #fff
    }

    .av {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--sky);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      flex: none
    }

    .band {
      background: var(--band);
      height: 70px;
      border-radius: 21px 21px 0 0;
      margin-top: 6px
    }

    .sheet {
      background: linear-gradient(#CED8E3, #89919A);
      border-radius: 21px 21px 0 0;
      margin-top: -34px;
      padding: 18px 16px 40px;
      flex: 1 0 auto;
      position: relative
    }

    .sheet.flat {
      margin-top: 16px
    }

    .card {
      background: linear-gradient(#ECF0F9, #D3D6DD);
      border: 0;
      border-radius: 21px;
      box-shadow: 1px 2px 5px 1.5px rgba(0, 0, 0, .4)
    }

    .form-control,
    .form-select {
      border-radius: 30px;
      border: 1px solid rgba(0, 0, 0, .28);
      padding: .6rem 1rem;
      background-color: #fff
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 .2rem rgba(41, 63, 89, .2)
    }

    .btn {
      border-radius: 16px;
      font-weight: 600
    }

    .btn-success {
      --bs-btn-color: #fff;
      --bs-btn-bg: var(--navy);
      --bs-btn-border-color: var(--navy);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #1b2c40;
      --bs-btn-hover-border-color: #1b2c40;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #1b2c40;
      --bs-btn-active-border-color: #1b2c40;
      --bs-btn-disabled-color: #fff;
      --bs-btn-disabled-bg: var(--navy);
      --bs-btn-disabled-border-color: var(--navy)
    }

    .btn-outline-success {
      --bs-btn-color: var(--navy);
      --bs-btn-border-color: var(--navy);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: var(--navy);
      --bs-btn-hover-border-color: var(--navy);
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: var(--navy);
      --bs-btn-active-border-color: var(--navy)
    }

    .btn-outline-secondary {
      --bs-btn-color: var(--navy);
      --bs-btn-border-color: #9fb0c2;
      --bs-btn-hover-color: var(--navy);
      --bs-btn-hover-bg: #e1e8ef;
      --bs-btn-hover-border-color: #9fb0c2;
      --bs-btn-active-color: var(--navy);
      --bs-btn-active-bg: #e1e8ef
    }

    .btn-warning {
      --bs-btn-color: var(--ink);
      --bs-btn-bg: var(--orange);
      --bs-btn-border-color: var(--orange);
      --bs-btn-hover-color: var(--ink);
      --bs-btn-hover-bg: #F19D52;
      --bs-btn-hover-border-color: #F19D52;
      --bs-btn-active-color: var(--ink);
      --bs-btn-active-bg: #F19D52;
      --bs-btn-active-border-color: #F19D52;
      --bs-btn-disabled-color: var(--ink);
      --bs-btn-disabled-bg: var(--orange);
      --bs-btn-disabled-border-color: var(--orange)
    }

    .bg-success {
      background-color: var(--blue) !important
    }

    .badge.bg-success {
      color: var(--ink)
    }

    .bg-warning {
      background-color: var(--yellow) !important
    }

    .bg-info-subtle {
      background-color: var(--sky) !important
    }

    .bg-success-subtle {
      background-color: #E1EFF7 !important
    }

    .border-success {
      border-color: var(--blue) !important
    }

    .text-bg-dark {
      background-color: var(--ink) !important
    }

    .alert-warning {
      --bs-alert-bg: #FDF1D4;
      --bs-alert-border-color: var(--yellow);
      --bs-alert-color: #5A3D00
    }

    .pill {
      background: var(--navy);
      color: #fff;
      border-radius: 20px;
      padding: 8px 0;
      flex: 1;
      margin: 0 8px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 4px 4px rgba(0, 0, 0, .25)
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px 0;
      text-align: center;
      font-size: .9rem
    }

    .cg b {
      font-weight: 400
    }

    .cg .sun {
      color: #ff0004
    }

    .cg .now {
      background: var(--navy);
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      line-height: 28px;
      margin: auto
    }

    .qm {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      text-align: center
    }

    .qm button {
      background: none;
      border: 0;
      color: var(--navy);
      font-size: .72rem;
      font-weight: 700;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      line-height: 1.25
    }

    .qc {
      display: flex;
      flex: none;
      width: 56px;
      height: 56px;
      margin: 0 auto 6px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem
    }

    .drw {
      position: fixed;
      inset: 0;
      z-index: 60;
      visibility: hidden
    }

    .drw.on {
      visibility: visible
    }

    .drw-bg {
      position: absolute;
      inset: 0;
      background: rgba(19, 34, 52, .55);
      opacity: 0;
      transition: .2s
    }

    .drw.on .drw-bg {
      opacity: 1
    }

    .drw-p {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 270px;
      background: var(--ink);
      color: #fff;
      transform: translateX(100%);
      transition: .2s;
      padding: 22px 12px;
      overflow: auto
    }

    .drw.on .drw-p {
      transform: none
    }

    .drw-p button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: none;
      border: 0;
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 600;
      text-align: left
    }

    .drw-p button.on {
      background: var(--navy)
    }

    .lg {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--navy)
    }

    .lg-top {
      background: var(--navy);
      padding: 36px 24px 80px;
      text-align: center
    }

    .logo-box {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .25)
    }

    .logo {
      width: 88%;
      height: 88%;
      object-fit: contain
    }

    .logo-fb {
      color: var(--navy);
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.1;
      letter-spacing: .08em;
      text-align: center
    }

    .lg-sheet {
      background: #fafafa;
      margin-top: -44px;
      border-radius: 60px 60px 0 0;
      padding: 36px 32px 40px;
      position: relative;
      min-height: calc(100vh - 232px)
    }

    @keyframes rise {
      from {
        transform: translateY(80px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .lg-sheet.rise {
      animation: rise .7s cubic-bezier(.22, 1, .36, 1) both
    }

    @media (prefers-reduced-motion:reduce) {
      .lg-sheet.rise {
        animation: none
      }
    }

    .seg {
      display: flex;
      gap: 6px;
      overflow-x: auto
    }

    .seg button {
      flex: 1 0 auto;
      border: 0;
      background: #fff;
      border-radius: 99px;
      padding: 7px 12px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy)
    }

    .seg button.on {
      background: var(--navy);
      color: #fff
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(19, 34, 52, .55);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .ov .card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow: auto
    }

    #bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: var(--orange);
      z-index: 99;
      display: none
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: inherit;
      --bs-table-border-color: rgba(41, 63, 89, .22);
      --bs-table-accent-bg: transparent;
      background: transparent
    }

    .table thead th {
      font-weight: 700
    }

    .cg .ev {
      position: relative;
      cursor: pointer
    }

    .cg .ev::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      border-radius: 50%;
      background: var(--orange)
    }

    .cg .now.ev::after {
      bottom: -5px
    }

    .cgrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px
    }

    .mcell {
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .15);
      cursor: pointer;
      font-size: .85rem
    }

    .mcell.done {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy)
    }

    .mcell.lock {
      background: #cbd2db;
      color: #6b7a8c
    }

    @media print {

      .hdr,
      .prof,
      .band,
      .drw,
      #bar,
      #toast,
      .btn,
      .no-print,
      .ov {
        display: none !important
      }

      body {
        background: #fff
      }

      .shell {
        max-width: none
      }

      .sheet {
        background: #fff !important;
        border-radius: 0;
        margin: 0 !important;
        padding: 0 !important
      }

      .card {
        break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ddd
      }

      .table-responsive {
        overflow: visible !important
      }

      .text-nowrap {
        white-space: normal !important
      }

      .table {
        font-size: .8rem
      }
    }
  </style>
</head>

<body>
  <div id="bar"></div>
  <div id="app"></div>
  <div id="toast" class="toast align-items-center text-bg-dark border-0 position-fixed start-50 translate-middle-x"
    style="bottom:90px;z-index:99">
    <div class="toast-body" id="tmsg"></div>
  </div>
  <script>
    /* ====== ISI: alamat proxy (Cloudflare Worker). URL & key Supabase TIDAK ada di file ini ====== */
    const API_URL = 'https://tight-sun-0f6d.askhacking.workers.dev';
    /* ================================================================================================ */
    if (typeof supabase === 'undefined') {
      document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#293F59"><b>Gagal memuat komponen aplikasi</b><div class="small">Periksa koneksi internet, lalu muat ulang.</div><button class="btn btn-success" onclick="location.reload()">Muat ulang</button></div>';
      throw new Error('supabase-js tidak termuat');
    }
    const sb = supabase.createClient(API_URL, 'public-anon-key-placeholder'); // key asli hanya ada di Worker
    const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])), rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    let dev = localStorage.getItem('dev'); if (!dev) { dev = crypto.randomUUID(); localStorage.setItem('dev', dev) }
    let S = null, tab = 'home', LR = [], LU = [], LP = null, hd = '', mode = 0;
    const busy = x => $('#bar').style.display = x ? 'block' : 'none';
    function toast(m, e) { const t = $('#toast'); t.className = 'toast show align-items-center border-0 position-fixed start-50 translate-middle-x text-bg-' + (e ? 'danger' : 'dark'); $('#tmsg').textContent = m; clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200) }
    async function rpc(fn, args, msg) {
      busy(1); const { data, error } = await sb.rpc(fn, { p_device: dev, ...(args || {}) }); busy(0);
      if (error) { const m = error.message; if (m === 'AUTH' || m === 'DEVICE') { await sb.auth.signOut(); logoutLocal(m === 'DEVICE' ? 'Perangkat ini tidak lagi terdaftar. Silakan login ulang.' : 'Sesi berakhir. Silakan login ulang.'); return null } toast(m, 1); return null }
      if (msg) toast(msg); return data
    }
    function modal(h, lock) { closeM(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="card card-body">${h}</div>`; if (!lock) o.onclick = e => { if (e.target === o) closeM() }; document.body.appendChild(o) }
    const closeM = () => { const o = $('#ov'); o && o.remove() };
    const lbl = t => `<label class="form-label fw-semibold small mt-2 mb-1">${t}</label>`;

    /* ---- Login & pendaftaran anggota ---- */
    const LOGO = `<div class="logo-box"><img src="assets/logo.png" alt="ICT Club" class="logo" onerror="this.style.display='none';document.getElementById('lgfb').style.display='block'"><div id="lgfb" class="logo-fb" style="display:none">ICT<br>CLUB</div></div>`;
    let riseOnce = true;
    const lgWrap = h => { const r = riseOnce ? ' rise' : ''; riseOnce = false; return `<div class="lg"><div class="lg-top">${LOGO}</div><div class="lg-sheet${r}">${h}</div></div>` };
    function viewLogin(msg) { closeM(); $('#app').innerHTML = lgWrap(`<h5 class="fw-bold mb-3">Masuk ke akun Anda</h5>${msg ? `<div class="alert alert-warning">${esc(msg)}</div>` : ''}${lbl('NIK')}<input id="nik" class="form-control" inputmode="numeric" autocomplete="username" placeholder="NIK">${lbl('Password')}<input id="pw" type="password" class="form-control" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn btn-success w-100 mt-4 py-2" onclick="doLogin()">Masuk</button><p class="text-secondary small text-center mt-3 mb-1">Lupa password? Hubungi pelatih atau pengurus.</p><p class="text-center small mt-4">Belum menjadi anggota? <a href="#" onclick="viewDaftar();return false">Daftar sebagai anggota</a></p><p class="text-secondary small text-center">Satu akun hanya dapat dipakai di satu perangkat.</p>`) }
    async function viewDaftar() {
      busy(1); const { data } = await sb.rpc('public_divisions'); busy(0); const dv = data || [];
      $('#app').innerHTML = lgWrap(`<h5 class="fw-bold mb-1">Pendaftaran anggota</h5><p class="text-secondary small">Pendaftaran disetujui pelatih, lalu akun diaktifkan pengurus. NIK dan password dikirim ke WhatsApp Anda setelah akun aktif.</p>${lbl('Nama lengkap')}<input id="dn" class="form-control" maxlength="100">${lbl('No. WhatsApp')}<input id="dh" class="form-control" inputmode="tel" placeholder="08xxxxxxxxxx">${lbl('Divisi')}<select id="dd" class="form-select"><option value="">Pilih divisi</option>${dv.map(x => `<option value="${x.id}">${esc(x.nama)}</option>`).join('')}</select>${lbl('Catatan (opsional)')}<input id="dc" class="form-control" maxlength="300"><input id="dw" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="btn btn-success w-100 mt-4 py-2" onclick="doDaftar()">Kirim pendaftaran</button><p class="text-center small mt-3"><a href="#" onclick="viewLogin();return false">Kembali ke login</a></p>`)
    }
    async function doDaftar() {
      const dd = $('#dd').value; if (!dd) return toast('Pilih divisi.', 1); busy(1);
      const { error } = await sb.rpc('submit_registration', { p_nama: $('#dn').value, p_hp: $('#dh').value, p_divisi: +dd, p_catatan: $('#dc').value || null, p_website: $('#dw').value || null }); busy(0);
      if (error) return toast(error.message, 1);
      $('#app').innerHTML = lgWrap(`<div class="text-center"><div class="display-4"><i class="bi bi-check-circle" style="color:var(--blue)"></i></div><h5 class="fw-bold">Pendaftaran terkirim</h5><p class="text-secondary small">Menunggu persetujuan pelatih, lalu aktivasi oleh pengurus. Informasi NIK dan password akan dikirim ke WhatsApp Anda.</p><button class="btn btn-success w-100" onclick="viewLogin()">Kembali ke login</button></div>`)
    }
    async function doLogin() {
      busy(1); const { error } = await sb.auth.signInWithPassword({ email: $('#nik').value.trim() + '@kas.local', password: $('#pw').value }); busy(0);
      if (error) return toast(error.status === 0 || error.name === 'AuthRetryableFetchError' || /fetch|network/i.test(error.message) ? 'Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.' : 'NIK atau password salah.', 1);
      const d = await rpc('claim_device'); if (!d) { await sb.auth.signOut(); return } S = d; start()
    }
    function logoutLocal(m) { S = null; viewLogin(m) }
    async function doLogout() { await sb.auth.signOut(); logoutLocal() }
    function start() { shell(); if (S.user.mustChange) modal(`<h5>Ganti password</h5><p class="text-secondary small">Demi keamanan, ganti password sementara Anda.</p>${lbl('Password saat ini')}<input id="fa" type="password" class="form-control">${lbl('Password baru (min. 6)')}<input id="fb" type="password" class="form-control"><button class="btn btn-success w-100 mt-3" onclick="doForce()">Simpan</button>`, true) }
    async function doForce() { const d = await rpc('change_password', { p_old: $('#fa').value, p_new: $('#fb').value }, 'Password diganti'); if (d) { S.user.mustChange = false; closeM() } }

    /* ---- Shell: header, menu samping, kalender, menu cepat ---- */
    const M = { home: ['Beranda', 'house'], hadir: ['Hadir & K
